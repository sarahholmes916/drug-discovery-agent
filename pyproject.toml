[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "drug-discovery-agent"
version = "0.1.1"
description = "Local-first, resumable drug-discovery workflow agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
scientific = [
  "numpy>=1.26",
  "scipy>=1.13",
  "rdkit>=2024.3",
  "gemmi>=0.7",
  "meeko>=0.7.1,<0.9",
]
reporting = ["openpyxl>=3.1,<4"]
runner = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
drug-agent = "apps.runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drug_discovery_agent", "apps"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
